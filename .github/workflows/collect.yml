name: Kumpulkan berita

# Pengumpul berkelanjutan. Jadwal cron GitHub tidak bisa diandalkan (bisa tertunda berjam-jam), jadi:
#   1. satu job menjalankan siklus tiap ~3 menit selama ~5 jam 40 menit (tools/loop.sh),
#   2. di akhir, job memanggil workflow ini lagi (workflow_dispatch) sehingga rantai tidak putus,
#   3. cron tiap 15 menit hanya jaga-jaga untuk menghidupkan kembali rantai bila terputus.
# Data JSON masuk ke branch `data` (tidak memicu build Pages); gh-pages hanya didorong bila index.html berubah
# atau tiap 30 menit sebagai salinan cadangan.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false      # run baru menunggu giliran, tidak memotong siklus yang sedang berjalan

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Jalankan siklus berulang
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODELS: ${{ secrets.LLM_MODELS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID: ${{ secrets.DUNE_QUERY_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_ANALYSTS: ${{ secrets.X_ANALYSTS }}
          CRYPTOPANIC_KEY: ${{ secrets.CRYPTOPANIC_KEY }}
          ALERT_MIN_SCORE: "70"
          LOOP_SECONDS: "20400"
          LOOP_INTERVAL: "180"
        run: bash tools/loop.sh

      - name: Sambung ke run berikutnya
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref "${GITHUB_REF_NAME}" || echo "tidak bisa memanggil ulang; cron akan menghidupkan kembali"
