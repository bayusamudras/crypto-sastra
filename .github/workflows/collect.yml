name: Kumpulkan berita

# Menjalankan Crypto Sastra tanpa server: tiap ~5 menit mengumpulkan berita, menilai, mengukur hasil,
# mengirim alert Telegram, lalu menerbitkan website + data ke branch gh-pages (GitHub Pages).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Muat data sebelumnya
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf out
          git clone --quiet --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" out 2>/dev/null || mkdir -p out

      - name: Jalankan satu siklus
        env:
          DATA_DIR: out/data
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          CRYPTOPANIC_KEY: ${{ secrets.CRYPTOPANIC_KEY }}
          ALERT_MIN_SCORE: "70"
        run: python3 server.py --once

      - name: Terbitkan ke gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp static/index.html out/index.html
          touch out/.nojekyll
          cd out
          [ -d .git ] || { git init -q -b gh-pages; git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"; }
          git config user.name "crypto-sastra-bot"
          git config user.email "bot@users.noreply.github.com"
          git config commit.gpgsign false
          git add -A
          if git rev-parse -q --verify HEAD >/dev/null; then
            git commit -q --amend -m "data $(date -u +%FT%TZ)"
          else
            git commit -q -m "data $(date -u +%FT%TZ)"
          fi
          git push -q --force origin gh-pages
